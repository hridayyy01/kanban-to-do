<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban To-Do</title>
    <!-- FONTAWESOME CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="./custom.css">
</head>

<body>
    <div class="shadow">
        <div class="d-flex justify-content-between align-items-center mb-3 p-4">
            <h3><i class="bi bi-kanban"></i> Kanban To-Do</h3>
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="fa fa-plus"></i> Add Task
            </button>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row kanban-board py-4">
            <div class="col-md-4">
                <div class="kanban-lane" id="todoLane">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5>To Do</h5>
                        <button class="btn btn-primary rounded-circle" data-bs-toggle="modal"
                            data-bs-target="#addTaskModal">
                            <i class="fa fa-plus"></i>
                        </button>
                        <div class="task-cards mt-4">

                    </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kanban-lane" id="todoLane">
                    <h5>In Progress</h5>
                    <div class="task-cards mt-4">

                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="kanban-lane" id="todoLane">
                    <h5>Done</h5>
                    <div class="task-cards mt-4">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP PLUGINS-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
        integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
        crossorigin="anonymous"></script>
    <!-- CUSTOM JS-->
    <script src="./app.js"></script>
</body>
